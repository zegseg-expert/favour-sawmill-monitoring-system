<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favour Sawmill Monitoring System</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f8ff;
            margin: 0;
            padding: 30px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 950px;
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #1e3c72;
            font-size: 28px;
            margin-top: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .live-cards {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }
        .card {
            flex: 1;
            min-width: 140px;
            background: #f8fafc;
            border-radius: 12px;
            padding: 15px 20px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        .card .label { font-size: 13px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
        .card .value { font-size: 26px; font-weight: bold; color: #1e3c72; margin-top: 5px; }
        .card .value span { font-size: 16px; font-weight: normal; color: #64748b; }
        
        .status-badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
            width: 100%;
        }
        .status-safe { background: #dcfce7; color: #166534; }
        .status-danger { background: #fee2e2; color: #991b1b; }

        .info-bar {
            text-align: center;
            font-size: 14px;
            color: #64748b;
            margin-bottom: 25px;
            background: #f1f5f9;
            padding: 10px;
            border-radius: 10px;
        }
        .table-container {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        th {
            background: #1e3c72;
            color: white;
            padding: 14px 12px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
        }
        td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #e2e8f0;
            font-size: 14px;
            color: #334155;
        }
        .footer {
            text-align: center;
            color: #94a3b8;
            margin-top: 25px;
            font-size: 13px;
            border-top: 1px solid #e2e8f0;
            padding-top: 20px;
        }
        @media (max-width: 600px) { .container { padding: 15px; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌲 Favour Sawmill Monitoring System</h1>
        <div class="subtitle">Real-time Air Quality & Dust Monitoring</div>

        <div class="live-cards">
            <div class="card">
                <div class="label">💨 PM2.5</div>
                <div class="value" id="pm25">-- <span>µg/m³</span></div>
            </div>
            <div class="card">
                <div class="label">🌀 Fans</div>
                <div class="value" id="fans">--</div>
            </div>
            <div class="card" style="flex: 1.5;">
                <div class="label">🚨 Status</div>
                <div id="statusBox" class="status-badge status-safe">✅ Air Quality Normal</div>
            </div>
        </div>

        <div class="info-bar">
            📡 Last Update: <span id="lastUpdate">--</span> &nbsp;|&nbsp; 
            📦 Total Readings: <span id="totalReadings">0</span>
        </div>

        <h2>📋 Last 10 Readings</h2>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>⏱️ TIME</th>
                        <th>💨 PM2.5 (µg/m³)</th>
                        <th>🌀 FANS</th>
                        <th>🚨 STATUS</th>
                    </tr>
                </thead>
                <tbody id="historyTableBody">
                    <tr><td colspan="5" style="color: #94a3b8; padding: 20px;">Loading data...</td></tr>
                </tbody>
            </table>
        </div>
        <div class="footer">Powered by Firebase & GitHub Pages</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCyTzs_TItKOtDo65NQWEhVIQHWpQEUtNc",
            authDomain: "favour-sawmill-monitorin-62eaf.firebaseapp.com",
            projectId: "favour-sawmill-monitorin-62eaf",
            storageBucket: "favour-sawmill-monitorin-62eaf.firebasestorage.app",
            messagingSenderId: "804940279117",
            appId: "1:804940279117:web:12e2000376d3a0e1f49b04"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function fetchData() {
            try {
                // 1. Fetch latest reading
                const qLatest = query(collection(db, "sawmill_readings"), orderBy("__name__", "desc"), limit(1));
                const latestSnapshot = await getDocs(qLatest);

                if (!latestSnapshot.empty) {
                    const latest = latestSnapshot.docs[0].data();
                    document.getElementById('pm25').innerHTML = (latest.pm25 || 0) + ' <span>µg/m³</span>';
                    document.getElementById('fans').textContent = latest.fan_active ? 'ON 🔵' : 'OFF';
                    document.getElementById('lastUpdate').textContent = 'Just now';

                    const statusBox = document.getElementById('statusBox');
                    if (latest.alert) {
                        statusBox.className = 'status-badge status-danger';
                        statusBox.textContent = '🚨 ALERT! High Dust Level!';
                    } else {
                        statusBox.className = 'status-badge status-safe';
                        statusBox.textContent = '✅ Air Quality Normal';
                    }
                }

                // 2. Fetch last 10 readings
                const qHistory = query(collection(db, "sawmill_readings"), orderBy("__name__", "desc"), limit(10));
                const historySnapshot = await getDocs(qHistory);
                
                let history = [];
                historySnapshot.forEach(doc => {
                    // Extract timestamp from the Document ID (Firestore auto-generates IDs with time)
                    const docId = doc.id;
                    let timeString = "--";
                    if (docId && docId.length > 8) {
                        // Firestore IDs contain time info - we just show the ID as a unique time marker
                        timeString = docId.substring(0, 8); 
                    }
                    history.push({ id: timeString, data: doc.data() });
                });
                history.reverse();

                const tableBody = document.getElementById('historyTableBody');
                tableBody.innerHTML = '';

                if (history.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="5" style="color: #94a3b8; padding: 20px;">No data received yet...</td></tr>`;
                } else {
                    history.forEach((row, index) => {
                        const fanText = row.data.fan_active ? 'ON 🔵' : 'OFF';
                        const statusText = row.data.alert ? '🔴 ALERT' : '🟢 SAFE';
                        
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${index + 1}</td>
                            <td>${row.id}</td>
                            <td>${row.data.pm25 || 0}</td>
                            <td>${fanText}</td>
                            <td style="font-weight: bold; color: ${row.data.alert ? '#991b1b' : '#166534'};">${statusText}</td>
                        `;
                        tableBody.appendChild(tr);
                    });
                    document.getElementById('totalReadings').textContent = history.length;
                }

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('pm25').textContent = 'Error';
            }
        }

        setInterval(fetchData, 3000);
        fetchData();
    </script>
</body>
</html>
